# Production topology: Nginx terminates TLS in front of the app and API,
# Redis backs rate limiting and caching across replicas, and Postgres and the
# media volume hold the durable state.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Run migrations before the first boot (the API refuses to start otherwise):
#   docker compose -f docker-compose.prod.yml run --rm migrate

services:
  db:
    image: postgres:16-alpine
    container_name: satya-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Larger checkpoints and WAL for a write-heavy clinical workload.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_compression=on
      -c log_min_duration_statement=1000
    volumes:
      - satya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 2G }

  redis:
    image: redis:7-alpine
    container_name: satya-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - satya_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot migration runner. The API will not start against an unmigrated
  # database, so this must succeed first.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: satya-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      APP_ENV: production
    volumes:
      - satya_media:/data/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 2G }

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the API in production, so the browser makes no
        # cross-origin requests and the CORS surface stays closed.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
    container_name: satya-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: satya-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - satya_certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  satya_pgdata:
  satya_redis:
  satya_media:
  satya_certbot:
