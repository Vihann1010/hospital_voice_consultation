services:
  db:
    image: postgres:16-alpine
    container_name: satya-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satya}
      POSTGRES_DB: ${POSTGRES_DB:-satya_hospital}
    volumes:
      - satya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satya} -d ${POSTGRES_DB:-satya_hospital}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: satya-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MEDIA_ROOT: /data/media
    volumes:
      # Consultation recordings must outlive the container.
      - satya_media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: satya-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  satya_pgdata:
  satya_media:
