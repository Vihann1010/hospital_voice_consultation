# Builds the Evanta HMS desktop shell (Tauri) into a real Windows .exe installer.
# Manual only (workflow_dispatch): a build is not free, and we don't want one firing on every push while this
# is still being proven out. Once the exe is trusted, this is the obvious place to add a tag-triggered build
# that publishes straight to the hub's release channel (see hub/app/routes_releases.py) — not done yet: that
# step would need the hub's admin token as a GitHub secret, which is a separate decision for the owner.
name: Desktop build (Windows)

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Where the bundled frontend calls the API at build time (normally left as the default; the exe itself only ever talks to 127.0.0.1:3443 at runtime)"
        required: false
        default: "http://127.0.0.1:8000"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend (minified + obfuscated)
        working-directory: frontend
        env:
          API_ORIGIN: ${{ github.event.inputs.api_origin }}
        run: |
          npm ci
          npm run build:secure

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust and Tauri build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: deploy/onprem/desktop/src-tauri -> target

      - name: Placeholder app icon (replace with a real one before a real release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy/onprem/desktop/src-tauri/icons | Out-Null
          if (-not (Test-Path deploy/onprem/desktop/src-tauri/icons/icon.ico)) {
            # A 1x1 transparent icon so the bundler does not fail for lack of one. This is NOT the real app
            # icon — swap it for Evanta's before this build is given to anyone outside testing.
            $bytes = [Convert]::FromBase64String("AAABAAEAAQEAAAEAIAAwAAAAFgAAACgAAAABAAAAAgAAAAEAIAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/////wA=")
            [IO.File]::WriteAllBytes("deploy/onprem/desktop/src-tauri/icons/icon.ico", $bytes)
          }

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: cargo tauri build
        working-directory: deploy/onprem/desktop
        run: cargo tauri build

      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-exe | Out-Null
          Copy-Item "deploy\onprem\desktop\src-tauri\target\release\bundle\nsis\*.exe" dist-exe\

      - uses: actions/upload-artifact@v4
        with:
          name: evanta-hms-windows-installer
          path: dist-exe/*.exe
          retention-days: 14
