[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers --tb=short
markers =
    unit: pure logic, no I/O — runs in milliseconds, no services needed
    integration: needs a live PostgreSQL (and optionally Redis)
    slow: excluded from the pre-commit run
filterwarnings =
    ignore::DeprecationWarning:passlib.*
