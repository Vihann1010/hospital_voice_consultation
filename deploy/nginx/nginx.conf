# Nginx reverse proxy for Satya Hospital.
#
# Terminates TLS, serves the Next.js app and the API from one origin (so the
# browser makes no cross-origin requests), and proxies the WebSocket upgrades
# that voice intake and dictation depend on.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"referer":"$http_referer","agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Uploads: reports can be 25 MB scans.
    client_max_body_size 30M;
    client_body_timeout 60s;
    client_header_timeout 20s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml;

    # Defence in depth: the application sets these too, but a proxy-level
    # limit protects the app even if a request never reaches it.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 16;
    }

    # ---- HTTP: redirect everything except the ACME challenge --------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS -----------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${NGINX_SERVER_NAME};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn_zone 40;

        # ---- WebSockets: voice intake and doctor dictation ---------------
        # Long-lived and must never be buffered or prematurely timed out.
        location ~ ^/api/v1/ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- Authentication: strictest limit ------------------------------
        location /api/v1/auth/login {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---- Health checks: never rate limited, never logged ---------------
        location /api/v1/health {
            access_log off;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---- Metrics: internal networks only -------------------------------
        location /api/v1/metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            access_log off;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ---- API -----------------------------------------------------------
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 120s;   # OCR and PDF work can be slow
        }

        # ---- Next.js static assets: immutable, cache hard -------------------
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ---- Application ----------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_common.conf;
        }
    }
}
